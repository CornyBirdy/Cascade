name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Stamped into the exe; the in-app updater compares it with releases.
      CASCADE_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Size
        shell: pwsh
        run: "(Get-Item target/release/cascade.exe).Length / 1KB | ForEach-Object { \"cascade.exe: {0:N0} KB\" -f $_ }"
      - uses: actions/upload-artifact@v4
        with:
          name: cascade
          path: target/release/cascade.exe
      # Every push to the default branch becomes a release the app can update to.
      - name: Release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cascade build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: target/release/cascade.exe
          make_latest: true
