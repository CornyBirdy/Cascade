[package]
name = "cascade"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tiny native notch for Windows"
publish = false

[dependencies]
windows-core = "0.61"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
	"Foundation",
	"Foundation_Collections",
	"Media_Control",
	"Storage_Streams",
	"Win32_Foundation",
	"Win32_Globalization",
	"Win32_Graphics_Direct2D",
	"Win32_Graphics_Direct2D_Common",
	"Win32_Graphics_DirectWrite",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Gdi",
	"Win32_Graphics_Imaging",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_LibraryLoader",
	"Win32_System_Ole",
	"Win32_System_Power",
	"Win32_System_Registry",
	"Win32_System_Rpc",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_System_WinRT",
	"Win32_System_Wmi",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
