[package]
name = "cascade-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-click installer for Cascade"
publish = false

# Its own crate: CI builds it after cascade.exe, which it carries inside.
[workspace]

[[bin]]
name = "CascadeSetup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
